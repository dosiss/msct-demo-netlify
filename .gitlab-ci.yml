stages:
  - build
  - deploy
  - cleanup
include:
- project: 'infra/ci'
  ref: master
  file: build-test.yml
variables:
  WERF_LOG_TERMINAL_WIDTH: 200
  GIT_DEPTH: 1

Build:
  stage: build
  script:
    - set -x
    - type trdl && source $(trdl use werf 1.2 ea)
    - type werf && source $(werf ci-env gitlab --as-file --verbose)
    - werf build
  except: [schedules]
  tags: [werf-runner]

.base_deploy: &base_deploy
  stage: deploy
  script:
    - set -x
    - type trdl && source $(trdl use werf 1.2 ea)
    - type werf && source $(werf ci-env gitlab --as-file --verbose)
    - werf helm dependency update .helm
    - werf converge --skip-build --namespace ${CI_ENVIRONMENT_SLUG} --env ${CI_ENVIRONMENT_SLUG} --set "global.env_url=$(echo ${CI_ENVIRONMENT_URL} | cut -d / -f 3)"
  dependencies:
    - Build
  except: [schedules]
  tags: [werf-runner]

Deploy to Test:
  <<: *base_deploy
  environment:
    name: test
    url: http://mascot.test.c27.games
  when: manual

Deploy to Dev:
  <<: *base_deploy
  environment:
    name: dev
    url: http://mascot.dev.c27.games
  when: manual

Deploy to Production:
  <<: *base_deploy
  environment:
    name: prod-mascot
    url: http://mascot.games
  variables:
    CF_ZONE: "efc2dffc3aa0495fbd052494d9197879"
    HOSTS: "mascot.games"
  script:
    - set -x
    - type trdl && source $(trdl use werf 1.2 ea)
    - type werf && source $(werf ci-env gitlab --as-file --verbose)
    - werf helm dependency update .helm
    - werf converge --skip-build --namespace ${CI_ENVIRONMENT_SLUG} --env ${CI_ENVIRONMENT_SLUG} --set "global.env_url=$(echo ${CI_ENVIRONMENT_URL} | cut -d / -f 3)"
    - |
      curl -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
        -H "Authorization: Bearer ${MSCTGMS_CF_PURGE_CACHE_TOKEN}" \
        -H "Content-Type:application/json" \
        -d '{
          "hosts": [
            ${HOSTS}
          ]
        }'
  when: manual

Cleanup:
  stage: cleanup
  script:
    - set -x
    - type trdl && source $(trdl use werf 1.2 ea)
    - type werf && source $(werf ci-env gitlab --as-file --verbose)
    - docker login -u nobody -p ${WERF_IMAGES_CLEANUP_PASSWORD} ${WERF_REPO}
    - werf cleanup
  only:
    refs: [schedules]
    variables:
      - $CLEANUP == "true"
  tags: [werf-runner]
